submission:
  title: "Coldfront - Supply Chain Disruption Assistant & Fleet Utilisation Optimizer"

  problem_statement: >
    When a storm closes a transhipment port or a strike shuts a terminal, the
    disruption cascades across hundreds of active shipments in ways a
    control-tower operator cannot track manually, while fleet assets sit idle in
    the wrong places and other lanes run overloaded. The sharpest edge is cold
    chain: a single temperature excursion on any leg can spoil 500,000 USD or
    more of vaccines or perishables, and today those breaches are discovered at
    the delivery door, when nothing can be done about them.

  solution_summary: >
    Coldfront is a control-tower system that ingests disruption feeds, shipment
    and leg data, fleet telemetry, and cold chain IoT sensor logs, then answers
    four questions in one place: which shipments are hit, what to do instead,
    which idle assets can be redeployed, and which cold chain cargo has breached
    its temperature envelope while there is still time to act. The core design
    decision is that deterministic rules make every decision and the language
    model only explains them, so each verdict carries its rule id, rule version,
    regulatory citation, and the exact sensor readings that produced it.

  key_features:
    - "Cold chain excursion detection classified by degree-minutes and Arrhenius mean kinetic temperature against versioned YAML rule packs (GDP, WHO PQS, USP 1079, FSMA), not just minutes out of range"
    - "Breach detection before delivery rather than after: every excursion is flagged by whether the leg is still in transit, so actionable breaches rank above post-mortems"
    - "Geospatial disruption impact matching against incomplete shipment legs, scored on delay hours, cargo value at risk, remaining cold-chain-stable hours, and downstream leg cascade, with score components exposed"
    - "Reroute ranking on delay recovery, cost, CO2, and cold chain continuity, where options that break the cold chain are never recommended and 'accept the delay' competes as a first-class option"
    - "Idle fleet redeployment ranked by wasted capacity-hours rather than asset count, backed by an append-only decision audit trail that rebuilds idempotently from raw readings"

  tech_stack:
    languages: ["Python 3.11", "TypeScript"]
    frameworks: ["FastAPI", "SQLAlchemy 2.x", "Pydantic v2", "React 18", "Vite", "Tailwind CSS"]
    ibm_technologies: ["IBM Bob", "watsonx.ai"]
    databases: ["SQLite"]
    other:
      - "MapLibre GL JS"
      - "Recharts"
      - "TanStack Query"
      - "Zustand"
      - "date-fns"
      - "Pytest"
      - "Vitest"
      - "React Testing Library"
      - "Alembic"
      - "openapi-typescript"
      - "GitHub Actions"

  what_we_are_most_proud_of: >
    Start in src/backend/app/engines/cold_chain.py and src/backend/app/rules/.
    Most approaches count minutes outside the allowed range, which treats thirty
    minutes at 25C and thirty minutes at 8.5C as the same event. Coldfront
    computes degree-minutes and Arrhenius mean kinetic temperature, handles the
    ways real telemetry fails (data gaps reported as compliance findings rather
    than interpolated away, stuck sensors flagged, door-open events tagged but
    not excused), and classifies severity against rule packs in versioned YAML
    with regulatory citations, so changing a threshold is a config change with an
    audit trail rather than a code edit. Underneath that is the decision we would
    defend hardest: the deterministic core is completely separable from the
    language layer. Remove the model and every number the system produces is
    unchanged and reproducible. The model explains a decision to a human, it
    never makes one. IBM Bob planned this architecture with us in Plan mode
    before a line was written, implemented the engines phase by phase, and
    reviewed the classification logic against the rule packs; the exported
    session reports in bob_sessions/ show that work.

  known_limitations: >
    Disruption feeds are simulated rather than live: the system ingests a
    documented feed schema but no production weather, AIS, or news integration is
    wired up. The carrier lane network is synthetic, generated against real
    published port and airport codes rather than pulled from carrier APIs, so
    reroute feasibility is plausible but not bookable. Redeployment matching uses
    a greedy assignment where min-cost-flow would be correct at scale; the
    trade-off is marked in the source. There is no authentication or
    multi-tenancy, and persistence is single-node SQLite. The fleet screen is our
    shallowest surface because we deliberately spent depth on the cold chain and
    impact engines. Tested on desktop Chrome and Firefox at 1440px; usable at
    768px but not built for mobile. All shipment, party, cargo, and telemetry
    data is synthetic by design, per the hackathon data compliance rules.

