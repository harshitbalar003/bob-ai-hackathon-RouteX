# ── Fleet ─────────────────────────────────────────────────────────────────────
fleet:
  total_count: 40
  idle_count: 18            # first 18 assets will be idle
  # Idle hours distribution: realistic long tail
  # first 2: reefer containers near shp-103 (guaranteed for the demo)
  reefer_idle_near: shp-103
  idle_hours_distribution:
    # [min_hours, max_hours, count] — defines buckets for the tail
    - [1,   12,  4]    # recently idled
    - [12,  48,  6]    # day-to-two
    - [48, 120,  5]    # 2–5 days (wasted-hours tail)
    - [120, 240, 3]    # critical waste
  asset_type_distribution:
    truck: 12
    trailer: 10
    container: 8
    reefer_container: 7
    vessel: 3
  home_depot_pool:
    [NLRTM, DEHAM, DESTR, BEFRA, GBFXT, AEDXB, SGSIN, CNSGH]
