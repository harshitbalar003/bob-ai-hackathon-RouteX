# ── Disruptions ───────────────────────────────────────────────────────────────
disruptions:
  - id: dis-001
    type: weather
    severity: critical
    confidence: 0.87
    headline: "Typhoon Krathon: Severe storm disrupting East Asia / South China Sea shipping lanes"
    detail: >
      A category-4 equivalent typhoon is tracking north-northeast across the South China
      Sea, generating sustained winds exceeding 150 km/h and wave heights above 8 m.
      Port operations at Shanghai Yangshan, Ningbo-Zhoushan, Xiamen, and Qingdao are
      suspended or severely curtailed.
    source: "Joint Typhoon Warning Center (JTWC) Feed"
    started_at_offset_h: -48
    expected_resolution_at: null
    area:
      center: {lat: 31.2, lng: 121.5, label: "Shanghai", unlocode: CNSGH}
      radius_km: 800
    affected_nodes: [CNSGH, CNNGB, CNXMN, CNQIN]

  - id: dis-002
    type: labour_action
    severity: major
    confidence: 0.72
    headline: "Port of Rotterdam dock workers strike: container terminal operations halted"
    detail: >
      Members of the FNV Havens union have commenced an indefinite strike action following
      a breakdown in wage negotiations. Container loading/unloading at ECT Delta and RWG
      terminals is at a standstill. Mediation talks are scheduled.
    source: "Lloyd's List Intelligence"
    started_at_offset_h: -72
    expected_resolution_at_offset_h: 168
    area:
      polygon:
        - [51.96, 4.02]
        - [51.97, 4.18]
        - [51.93, 4.22]
        - [51.89, 4.25]
        - [51.86, 4.15]
        - [51.88, 4.00]
        - [51.93, 3.97]
        - [51.96, 4.02]
    affected_nodes: [NLRTM, NLMSV]

  - id: dis-003
    type: congestion
    severity: minor
    confidence: 0.55
    headline: "A2 motorway corridor Germany: road works causing significant freight delays"
    detail: >
      Planned resurfacing and bridge maintenance works between Karlsruhe and Ulm are
      causing queue lengths of up to 35 km during peak hours. HGV transit times have
      increased by an average of 4.5 hours.
    source: "BASt Traffic Report"
    started_at_offset_h: -24
    expected_resolution_at_offset_h: 48
    area:
      center: {lat: 48.78, lng: 9.18, label: "Stuttgart / A2 Corridor"}
      radius_km: 120
    affected_nodes: [DESTR, DEULM, DEKHE]

